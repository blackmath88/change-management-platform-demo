<!doctype html><html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"><title>Changefield · Pilotakte</title><style>/*
 * Changefield renderer 0.1
 * Consumes the intent of:
 *   after-wada-doctrine 1.0.0
 *   after-wada-type 1.0.0
 *   seq-stone-ledger 1.0.0
 *   pair-01-dusk-vermillion 1.0.0
 *
 * Values are mapped for interface contrast; relational roles remain primary.
 */
:root {
  --ground: #f1ece1;
  --ground-deep: #e5ddce;
  --raised: #faf6ee;
  --quiet: #cfc4b1;
  --quiet-dark: #685f53;
  --ink: #2e3438;
  --ink-soft: #596166;
  --mineral: #56707a;
  --mineral-deep: #344f59;
  --mineral-pale: #d8e0df;
  --vermillion: #8e4936;
  --vermillion-deep: #693225;
  --vermillion-pale: #ead8cf;
  --moss: #5f6b3d;
  --paper-white: #fffdf8;

  --line: color-mix(in srgb, var(--ink) 21%, transparent);
  --line-light: color-mix(in srgb, var(--ink) 11%, transparent);
  --focus: #365089;

  --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
  --sans: Inter, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;

  --rail: 17.5rem;
  --gutter: clamp(1.25rem, 3.2vw, 3.75rem);
  --rule: 1px solid var(--line);
  --radius-control: 0.2rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}


* {
  box-sizing: border-box;
}

html {
  min-width: 320px;
  min-height: 100%;
  overflow-x: hidden;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  text-rendering: optimizeLegibility;
}

body {
  min-height: 100vh;
  margin: 0;
  overflow-x: hidden;
  background:
    radial-gradient(circle at 18% 8%, rgb(255 255 255 / 22%), transparent 31rem),
    repeating-linear-gradient(97deg, transparent 0 9px, rgb(46 52 56 / 0.012) 10px),
    var(--ground);
}

body::before {
  position: fixed;
  z-index: 100;
  inset: 0;
  pointer-events: none;
  content: "";
  opacity: 0.19;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
  mix-blend-mode: multiply;
}

html[data-material="clear"] body {
  background: var(--ground);
}

html[data-material="clear"] body::before {
  display: none;
}

html[data-material="clear"] .modal,
html[data-material="clear"] .context-brief {
  background: var(--raised);
}

html[data-material="fibre"] body {
  background:
    radial-gradient(ellipse at 14% 6%, rgb(255 255 255 / 28%), transparent 34rem),
    radial-gradient(ellipse at 83% 72%, rgb(142 73 54 / 3.5%), transparent 38rem),
    repeating-linear-gradient(94deg, transparent 0 5px, rgb(46 52 56 / 1.8%) 6px),
    repeating-linear-gradient(3deg, transparent 0 17px, rgb(255 255 255 / 8%) 18px),
    var(--ground);
}

html[data-material="fibre"] body::before {
  opacity: 0.34;
}

html[data-material="fibre"] body::after {
  position: fixed;
  z-index: 99;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(101deg, transparent 0 31px, rgb(46 52 56 / 1.5%) 32px),
    repeating-linear-gradient(7deg, transparent 0 53px, rgb(250 246 238 / 12%) 54px);
  content: "";
  mix-blend-mode: multiply;
}

button,
input,
textarea,
select {
  color: inherit;
  font: inherit;
}

button,
select {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

::selection {
  background: var(--mineral);
  color: var(--raised);
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.meta-label {
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.15em;
  line-height: 1.35;
  text-transform: uppercase;
}

.brand {
  display: grid;
  grid-template-columns: auto auto;
  align-items: center;
  width: max-content;
  column-gap: 0.72rem;
  row-gap: 0.05rem;
}

.brand__mark {
  position: relative;
  display: grid;
  grid-row: 1 / 3;
  grid-template-columns: 61% 39%;
  width: 2rem;
  height: 2rem;
  border: 1px solid var(--ink);
}

.brand__mark i:first-child {
  background: var(--ground);
}

.brand__mark i:last-child {
  background: var(--vermillion);
}

.brand__mark::after {
  position: absolute;
  right: 0;
  bottom: 0;
  width: 39%;
  height: 32%;
  background: var(--ink);
  content: "";
}

.brand__name {
  align-self: end;
  font-family: var(--serif);
  font-size: 1.28rem;
  font-weight: 600;
  letter-spacing: -0.035em;
  line-height: 1;
}

.brand__descriptor {
  align-self: start;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.57rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.brand--compact {
  grid-template-columns: auto;
}

.brand--compact .brand__mark {
  grid-row: 1;
}

.brand--compact .brand__name {
  display: none;
}

.status-mark {
  display: inline-flex;
  align-items: center;
  gap: 0.48rem;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.63rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.status-mark > span {
  width: 0.48rem;
  height: 0.48rem;
  border: 1px solid currentColor;
  border-radius: 50%;
}

.status-mark--active > span {
  border-color: var(--moss);
  background: var(--moss);
}

.status-mark--paused > span {
  border-color: var(--vermillion);
  background: var(--vermillion);
}

.status-mark--complete > span {
  border-color: var(--mineral);
  background: var(--mineral);
}

/* Portfolio — the case index is a ledger, not a grid of interchangeable cards. */
.portfolio {
  min-height: 100vh;
  padding: 0 var(--gutter) 4rem;
}

.portfolio__masthead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 6.25rem;
  border-bottom: var(--rule);
}

.portfolio__date {
  display: flex;
  align-items: center;
  gap: 2.2rem;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.sync-indicator {
  display: inline-flex;
  align-items: center;
  gap: 0.48rem;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.sync-indicator i {
  width: 0.42rem;
  height: 0.42rem;
  border: 1px solid currentColor;
  border-radius: 50%;
}

.sync-indicator--quiet i {
  border-color: var(--moss);
  background: var(--moss);
}

.sync-indicator--synchronizing i {
  border-color: var(--mineral);
  border-top-color: transparent;
  animation: sync-turn 700ms linear infinite;
}

.sync-indicator--conflict,
.sync-indicator--error {
  color: var(--vermillion-deep);
}

.sync-indicator--conflict i,
.sync-indicator--error i {
  background: var(--vermillion);
}

.material-trigger {
  display: inline-flex;
  align-items: center;
  gap: 0.48rem;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.material-trigger > i {
  width: 0.75rem;
  height: 0.75rem;
  border: 1px solid var(--quiet-dark);
  background:
    repeating-linear-gradient(105deg, transparent 0 2px, var(--quiet-dark) 3px);
}

.material-trigger--compact {
  width: 2rem;
  height: 2rem;
  justify-content: center;
}

.material-trigger--compact > i {
  width: 0.9rem;
  height: 0.9rem;
}

.portfolio__main {
  max-width: 92rem;
  margin: 0 auto;
}

.portfolio__introduction {
  display: grid;
  grid-template-columns: minmax(5rem, 0.5fr) minmax(28rem, 5fr) minmax(15rem, 2fr);
  gap: clamp(1.5rem, 4vw, 5rem);
  align-items: end;
  min-height: 25rem;
  padding: 5rem 0 4rem;
  border-bottom: var(--rule);
}

.folio-number {
  align-self: start;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.14em;
}

.portfolio__introduction h1 {
  max-width: 62rem;
  margin: 0.75rem 0 0;
  font-family: var(--serif);
  font-size: clamp(3.25rem, 6.6vw, 7.4rem);
  font-weight: 400;
  letter-spacing: -0.065em;
  line-height: 0.87;
}

.portfolio__thesis {
  max-width: 26rem;
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: clamp(1.05rem, 1.4vw, 1.32rem);
  line-height: 1.47;
}

.case-index {
  display: grid;
  grid-template-columns: minmax(10rem, 1.25fr) minmax(0, 6fr);
  padding: 3rem 0;
}

.case-index__header {
  grid-column: 1 / -1;
  display: grid;
  grid-template-columns: subgrid;
  padding-bottom: 1.25rem;
  border-bottom: 2px solid var(--ink);
}

.case-index__header h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 500;
}

.case-index__header span {
  justify-self: end;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.case-list {
  grid-column: 1 / -1;
  padding: 0;
  margin: 0;
  list-style: none;
}

.case-list li {
  border-bottom: var(--rule);
}

.case-row {
  position: relative;
  display: grid;
  grid-template-columns: minmax(3.5rem, 0.6fr) minmax(15rem, 2.7fr) minmax(18rem, 3.4fr) minmax(9rem, 1.25fr) 1.5rem;
  gap: clamp(1rem, 2vw, 2.2rem);
  align-items: center;
  min-height: 8.1rem;
  transition: background 180ms ease;
}

.case-row > * {
  min-width: 0;
}

.case-row::before {
  position: absolute;
  inset: 0 auto 0 calc(var(--gutter) * -1);
  width: 0;
  background: var(--vermillion);
  content: "";
  transition: width 220ms var(--ease-out);
}

.case-row:hover {
  background: color-mix(in srgb, var(--raised) 48%, transparent);
}

.case-row:hover::before {
  width: 0.3rem;
}

.case-row__number {
  align-self: start;
  padding-top: 2.25rem;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.66rem;
}

.case-row__identity {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.case-row__identity strong {
  font-family: var(--serif);
  font-size: clamp(1.35rem, 2.1vw, 2rem);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.05;
  overflow-wrap: anywhere;
}

.case-row__identity span,
.case-row__signal {
  color: var(--ink-soft);
  font-size: 0.78rem;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.case-row__signal {
  max-width: 34rem;
}

.case-row__meta {
  display: flex;
  flex-direction: column;
  gap: 0.75rem;
  align-items: flex-end;
}

.case-row__meta time {
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
}

.case-row__arrow {
  color: var(--vermillion);
  font-size: 1.2rem;
  transition: transform 180ms var(--ease-out);
}

.case-row:hover .case-row__arrow {
  transform: translate(0.2rem, -0.2rem);
}

.case-index__footer {
  grid-column: 2;
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 2rem;
  padding-top: 2rem;
}

.case-index__actions {
  display: flex;
  flex-wrap: wrap;
  gap: 1.5rem 2rem;
  align-items: flex-start;
}

.case-index__footer p {
  margin: 0;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.04em;
  line-height: 1.6;
  text-align: right;
  text-transform: uppercase;
}

.begin-case,
.import-case__button,
.record-toolbar button {
  padding: 0.25rem 0 0.55rem;
  border: 0;
  border-bottom: 1px solid var(--vermillion);
  background: transparent;
  color: var(--vermillion-deep);
  font-family: var(--mono);
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.import-case {
  position: relative;
}

.import-case__button {
  display: inline-block;
  border-bottom-color: var(--mineral);
  color: var(--mineral-deep);
  cursor: pointer;
}

.import-case__button input {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  clip-path: inset(50%);
  white-space: nowrap;
}

.import-case > p {
  position: absolute;
  top: 1.7rem;
  left: 0;
  width: min(26rem, 70vw);
  color: var(--vermillion-deep);
  font-family: var(--sans);
  font-size: 0.67rem;
  letter-spacing: 0;
  text-align: left;
  text-transform: none;
}

.begin-case span {
  display: inline-block;
  margin-left: 1rem;
  transition: transform 180ms var(--ease-out);
}

.begin-case:hover span {
  transform: translate(0.2rem, -0.2rem);
}

.case-loading {
  grid-column: 1 / -1;
  padding: 5rem 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 1.3rem;
}

.case-loading--page {
  display: grid;
  min-height: 100vh;
  place-items: center;
}

/* Dialog: one vermilion action, otherwise quiet paper. */
.modal-overlay {
  position: fixed;
  z-index: 200;
  display: grid;
  inset: 0;
  padding: 1rem;
  background: rgb(28 31 31 / 58%);
  place-items: center;
  backdrop-filter: blur(4px);
}

.modal-overlay[data-entering] {
  animation: veil-in 180ms ease-out;
}

.modal {
  width: min(38rem, 100%);
  max-height: calc(100vh - 2rem);
  overflow: auto;
  background:
    repeating-linear-gradient(96deg, transparent 0 12px, rgb(46 52 56 / 1.3%) 13px),
    var(--raised);
  box-shadow: 0 2rem 5rem rgb(20 24 24 / 30%);
}

.modal[data-entering] {
  animation: sheet-in 280ms var(--ease-out);
}

.new-case-dialog {
  padding: clamp(2rem, 5vw, 4rem);
  outline: none;
}

.dialog-index {
  margin-bottom: 3rem;
  color: var(--vermillion);
  font-family: var(--mono);
  font-size: 0.63rem;
  letter-spacing: 0.14em;
}

.new-case-dialog h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2.8rem, 7vw, 4.6rem);
  font-weight: 400;
  letter-spacing: -0.06em;
  line-height: 0.95;
}

.new-case-dialog form > p {
  max-width: 28rem;
  margin: 1.25rem 0 2.5rem;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 1.05rem;
  line-height: 1.45;
}

.new-case-dialog [data-rac] {
  display: flex;
  flex-direction: column;
}

.new-case-dialog label {
  margin: 1.25rem 0 0.45rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.new-case-dialog input,
.new-case-dialog textarea {
  width: 100%;
  padding: 0.75rem 0;
  border: 0;
  border-bottom: var(--rule);
  border-radius: 0;
  outline: none;
  background: transparent;
  font-family: var(--serif);
  font-size: 1.1rem;
}

.new-case-dialog textarea {
  min-height: 6rem;
  resize: vertical;
}

.new-case-dialog input:focus,
.new-case-dialog textarea:focus {
  border-bottom-color: var(--vermillion);
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 1rem;
  margin-top: 2.5rem;
}

.quiet-button,
.action-button {
  min-height: 2.8rem;
  padding: 0 1.25rem;
  border: 1px solid var(--ink);
  border-radius: var(--radius-control);
  background: transparent;
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.action-button {
  border-color: var(--vermillion-deep);
  background: var(--vermillion-deep);
  color: var(--raised);
}

/* Persistent case shell */
.case-shell {
  display: grid;
  grid-template-columns: var(--rail) minmax(0, 1fr);
  min-height: 100vh;
}

.case-rail {
  position: sticky;
  top: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
  border-right: var(--rule);
  background: color-mix(in srgb, var(--ground-deep) 54%, var(--ground));
}

.case-rail__brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  min-height: 5.5rem;
  padding: 0 1.6rem;
  border-bottom: var(--rule);
}

.back-to-index {
  margin: 1.5rem 1.6rem 0;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.61rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.case-rail__identity {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  min-height: 10.5rem;
  padding: 2.5rem 1.6rem 2rem;
  border-bottom: var(--rule);
}

.case-rail__identity strong {
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.08;
}

.case-rail__identity > span:last-child {
  color: var(--ink-soft);
  font-size: 0.7rem;
}

.case-actions {
  display: flex;
  flex-direction: column;
  gap: 0.55rem;
  align-items: flex-start;
  margin-top: 0.6rem;
}

.case-actions > button {
  width: max-content;
  padding: 0.15rem 0 0.3rem;
  border: 0;
  background: transparent;
  color: var(--mineral-deep);
  font-family: var(--mono);
  font-size: 0.55rem;
  letter-spacing: 0.07em;
  text-transform: uppercase;
}

.case-actions > button:hover {
  box-shadow: inset 0 -1px var(--mineral);
}

.case-actions > .case-actions__delete {
  color: var(--quiet-dark);
}

.case-actions > .case-actions__delete:hover {
  color: var(--vermillion-deep);
  box-shadow: inset 0 -1px var(--vermillion);
}

.case-navigation {
  flex: 1;
  padding: 1rem 0;
}

.case-navigation__index-mobile {
  display: none;
}

.case-navigation__item {
  position: relative;
  display: grid;
  grid-template-columns: 2.3rem 1fr auto;
  align-items: center;
  min-height: 3.1rem;
  padding: 0 1.6rem;
  color: var(--ink-soft);
}

.case-navigation__item::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0;
  background: var(--vermillion);
  content: "";
  transition: width 180ms var(--ease-out);
}

.case-navigation__item > span {
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.57rem;
}

.case-navigation__item strong {
  font-family: var(--serif);
  font-size: 0.96rem;
  font-weight: 500;
}

.case-navigation__item i {
  width: 0.34rem;
  height: 0.34rem;
  border: 1px solid var(--quiet-dark);
  border-radius: 50%;
}

.case-navigation__item:hover,
.case-navigation__item.is-active {
  background: rgb(250 246 238 / 44%);
  color: var(--ink);
}

.case-navigation__item.is-active::before {
  width: 0.24rem;
}

.case-navigation__item.is-active i {
  border-color: var(--vermillion);
  background: var(--vermillion);
}

.case-rail__footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 4.5rem;
  padding: 0 1.6rem;
  border-top: var(--rule);
}

.case-rail__footer > span:last-child {
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.57rem;
  text-transform: uppercase;
}

.case-stage {
  min-width: 0;
}

.stage-header {
  display: grid;
  border-bottom: var(--rule);
}

.stage-header h1 {
  margin: 0.8rem 0 0;
  font-family: var(--serif);
  font-size: clamp(2.8rem, 5.4vw, 6rem);
  font-weight: 400;
  letter-spacing: -0.065em;
  line-height: 0.93;
}

/* Case plate follows a Wada-style area hierarchy rather than equal cards. */
.case-plate {
  min-height: 100vh;
  padding: 0 var(--gutter) 2.5rem;
}

.stage-header--plate {
  grid-template-columns: minmax(0, 1.9fr) minmax(17rem, 0.8fr);
  gap: 3rem;
  align-items: end;
  min-height: 17rem;
  padding: 3rem 0;
}

.stage-header--plate > p {
  max-width: 28rem;
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 1.05rem;
  line-height: 1.48;
}

.case-composition {
  display: grid;
  grid-template-columns: 4fr 4fr 3fr;
  grid-template-rows: minmax(16rem, auto) minmax(14rem, auto) minmax(13rem, auto);
  border-right: var(--rule);
  border-bottom: var(--rule);
  border-left: var(--rule);
}

.case-composition > section {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  padding: clamp(1.5rem, 3vw, 3rem);
}

.composition-direction {
  grid-row: 1 / 3;
  grid-column: 1 / 3;
  justify-content: space-between;
  background: var(--raised);
}

.composition-direction::after {
  position: absolute;
  top: 0;
  right: 0;
  width: 0.35rem;
  height: 28%;
  background: var(--vermillion);
  content: "";
}

.composition-direction blockquote {
  max-width: 52rem;
  margin: 3rem 0;
  font-family: var(--serif);
  font-size: clamp(2rem, 4vw, 4.6rem);
  letter-spacing: -0.052em;
  line-height: 1.02;
}

.composition-field {
  grid-row: 1;
  grid-column: 3;
  padding: 0 !important;
  overflow: hidden;
  border-left: var(--rule);
  background: var(--mineral-pale);
}

.relational-field {
  width: 100%;
  height: 100%;
  min-height: 16rem;
}

.field-line {
  fill: none;
  stroke: var(--mineral-deep);
  stroke-width: 0.24;
  opacity: 0.25;
}

.field-line--two {
  stroke: var(--vermillion);
  opacity: 0.2;
}

.field-connection {
  stroke: var(--ink);
  stroke-width: 0.18;
  opacity: 0.2;
}

.field-mark circle:last-child {
  fill: var(--mineral);
  stroke: var(--raised);
  stroke-width: 0.4;
}

.field-mark--warm circle:last-child {
  fill: var(--vermillion);
}

.field-mark--quiet circle:last-child {
  fill: var(--quiet-dark);
}

.relational-field text {
  fill: var(--mineral-deep);
  font-family: var(--mono);
  font-size: 2.3px;
  letter-spacing: 0.1em;
}

.composition-signals {
  grid-row: 2 / 4;
  grid-column: 3;
  border-top: var(--rule);
  border-left: var(--rule);
  background: var(--ground-deep);
}

.composition-signals dl {
  margin: 2rem 0 0;
}

.composition-signals dl > div {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: baseline;
  padding: 1rem 0;
  border-bottom: var(--rule);
}

.composition-signals dt {
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 1rem;
}

.composition-signals dd {
  margin: 0;
  font-family: var(--mono);
  font-size: 1.25rem;
}

.composition-attention {
  grid-row: 3;
  grid-column: 1;
  border-top: var(--rule);
  background: var(--vermillion-pale);
}

.composition-actor {
  grid-row: 3;
  grid-column: 2;
  border-top: var(--rule);
  border-left: var(--rule);
  background: var(--ground);
}

.composition-next {
  display: none !important;
}

.composition-attention h2,
.composition-actor h2,
.composition-next h2 {
  margin: 2rem 0 0.7rem;
  font-family: var(--serif);
  font-size: clamp(1.4rem, 2.1vw, 2rem);
  font-weight: 500;
  letter-spacing: -0.035em;
  line-height: 1.08;
}

.composition-attention > p:not(.meta-label),
.composition-actor > p:not(.meta-label) {
  margin: 0 0 2rem;
  color: var(--ink-soft);
  font-size: 0.75rem;
  line-height: 1.5;
}

.section-link {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
  margin-top: auto;
  padding-top: 1rem;
  border-top: var(--rule);
  font-family: var(--mono);
  font-size: 0.61rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.section-link span {
  color: var(--vermillion);
  font-size: 1rem;
}

.plate-footer {
  display: grid;
  grid-template-columns: auto minmax(6rem, 1fr) auto;
  gap: 1.2rem;
  align-items: center;
  padding: 1.3rem 0;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.08em;
}

.plate-footer__track {
  display: block;
  height: 2px;
  background: var(--quiet);
}

.plate-footer__track i {
  display: block;
  height: 100%;
  background: var(--mineral);
  transition: width 500ms var(--ease-out);
}

.plate-footer strong {
  font-weight: 500;
}

/* Working fields */
.workspace {
  min-height: 100vh;
}

.workspace__header {
  position: relative;
  grid-template-columns: 4rem minmax(25rem, 1.9fr) minmax(16rem, 0.75fr);
  gap: clamp(1.5rem, 3vw, 4rem);
  align-items: end;
  min-height: 20rem;
  padding: 3.5rem var(--gutter);
}

.workspace__header > div:nth-child(2) {
  align-self: end;
}

.workspace__index {
  align-self: start;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.7rem;
  letter-spacing: 0.1em;
}

.workspace__header > p {
  max-width: 25rem;
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 1rem;
  line-height: 1.5;
}

.save-state {
  position: absolute;
  top: 2rem;
  right: var(--gutter);
  display: flex;
  align-items: center;
  gap: 0.65rem;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.57rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.save-state__line {
  position: relative;
  display: block;
  width: 2.5rem;
  height: 1px;
  overflow: hidden;
  background: var(--quiet);
}

.save-state--mark-made .save-state__line::after {
  position: absolute;
  width: 50%;
  height: 100%;
  background: var(--vermillion);
  content: "";
  animation: record-line 800ms ease-in-out infinite;
}

.save-state--recorded {
  color: var(--moss);
}

.save-state--recorded .save-state__line {
  background: var(--moss);
}

.workspace__body {
  max-width: 100rem;
  padding: 0 var(--gutter) 6rem;
  margin: 0 auto;
}

.thought-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
}

.thought-field {
  position: relative;
  min-height: 18rem;
  padding: clamp(2rem, 4vw, 4rem);
  border-right: var(--rule);
  border-bottom: var(--rule);
}

.thought-field:nth-child(odd) {
  border-left: var(--rule);
}

.thought-field__label {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
}

.thought-field__label label,
.thought-field__label span {
  font-family: var(--mono);
  font-size: 0.63rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.thought-field__label span {
  color: var(--vermillion);
}

.thought-field > p {
  max-width: 32rem;
  margin: 0.7rem 0 2.25rem;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 0.95rem;
  line-height: 1.46;
}

.thought-field textarea {
  display: block;
  width: 100%;
  min-height: 7rem;
  padding: 0;
  border: 0;
  outline: none;
  resize: vertical;
  background: transparent;
  font-family: var(--serif);
  font-size: clamp(1.3rem, 2vw, 1.75rem);
  letter-spacing: -0.022em;
  line-height: 1.35;
}

.thought-field:focus-within {
  background: var(--raised);
}

.thought-field:focus-within::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0.22rem;
  background: var(--vermillion);
  content: "";
}

.record-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  min-height: 5.5rem;
  border-bottom: 2px solid var(--ink);
}

.record-toolbar > span {
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.pressure-record {
  position: relative;
  display: grid;
  grid-template-columns: 3rem minmax(20rem, 1fr) minmax(12rem, 0.3fr);
  gap: 2rem;
  min-height: 12rem;
  padding: 2rem;
  border-right: var(--rule);
  border-bottom: var(--rule);
  border-left: var(--rule);
  background: color-mix(in srgb, var(--raised) 32%, transparent);
}

.pressure-record::before {
  position: absolute;
  inset: 0 auto 0 0;
  width: 0.22rem;
  background: var(--mineral);
  content: "";
}

.pressure-record--constraining::before {
  background: var(--vermillion);
}

.record-index {
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.62rem;
}

.record-main {
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}

.record-main input,
.actor-record__identity input,
.difference-record header input {
  border: 0;
  border-bottom: var(--rule);
  outline: none;
  background: transparent;
  font-family: var(--serif);
  font-size: 1.4rem;
  letter-spacing: -0.025em;
}

.record-main textarea,
.actor-record textarea,
.experiment-record textarea,
.difference-record textarea {
  min-height: 4rem;
  padding: 0.65rem 0;
  border: 0;
  border-bottom: var(--rule);
  outline: none;
  resize: vertical;
  background: transparent;
  color: var(--ink-soft);
  font-size: 0.78rem;
  line-height: 1.5;
}

.record-controls {
  display: flex;
  flex-direction: column;
  gap: 1.1rem;
}

.record-controls label,
.actor-record > label {
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.56rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

select {
  padding: 0.5rem 1.7rem 0.5rem 0.5rem;
  border: var(--rule);
  border-radius: 0;
  background: var(--ground);
  font-family: var(--mono);
  font-size: 0.62rem;
  text-transform: uppercase;
}

input[type="range"] {
  width: 100%;
  accent-color: var(--mineral);
}

.pressure-record--constraining input[type="range"] {
  accent-color: var(--vermillion);
}

.remove-record {
  width: max-content;
  padding: 0;
  border: 0;
  border-bottom: 1px solid transparent;
  background: none;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.55rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.remove-record:hover {
  border-color: var(--vermillion);
  color: var(--vermillion);
}

.pressure-field + .thought-field,
.actor-ledger + .thought-field,
.difference-list + .thought-field {
  margin-top: 4rem;
  border-left: var(--rule);
}

/* Influence — position and relation carry the information, not decorative color. */
.influence-map {
  position: relative;
  height: clamp(25rem, 48vw, 42rem);
  margin-bottom: 3rem;
  overflow: hidden;
  border-right: var(--rule);
  border-bottom: var(--rule);
  border-left: var(--rule);
  background:
    linear-gradient(90deg, var(--vermillion-pale), transparent 32%, transparent 68%, var(--mineral-pale)),
    linear-gradient(var(--line-light) 1px, transparent 1px),
    linear-gradient(90deg, var(--line-light) 1px, transparent 1px),
    var(--raised);
  background-size: auto, 100% 25%, 25% 100%, auto;
}

.influence-map::before,
.influence-map::after {
  position: absolute;
  content: "";
  background: var(--ink);
  opacity: 0.18;
}

.influence-map::before {
  top: 0;
  left: 50%;
  width: 1px;
  height: 100%;
}

.influence-map::after {
  top: 50%;
  left: 0;
  width: 100%;
  height: 1px;
}

.influence-map__axis {
  position: absolute;
  z-index: 2;
  display: flex;
  justify-content: space-between;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.52rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.influence-map__axis--x {
  right: 1rem;
  bottom: 0.75rem;
  left: 1rem;
}

.influence-map__axis--y {
  top: 1rem;
  bottom: 1.8rem;
  left: 0.7rem;
  flex-direction: column;
}

.actor-node {
  position: absolute;
  z-index: 3;
  display: grid;
  min-width: 3rem;
  padding: 0.35rem;
  border: 1px solid var(--mineral-deep);
  border-radius: 50%;
  background: color-mix(in srgb, var(--mineral-pale) 80%, transparent);
  color: var(--mineral-deep);
  font-family: var(--serif);
  font-size: clamp(0.62rem, 1vw, 0.82rem);
  line-height: 1.05;
  text-align: center;
  transform: translate(-50%, -50%);
  place-items: center;
  transition: left 400ms var(--ease-out), top 400ms var(--ease-out);
}

.actor-node:nth-of-type(even) {
  border-color: var(--vermillion);
  background: color-mix(in srgb, var(--vermillion-pale) 76%, transparent);
  color: var(--vermillion-deep);
}

.actor-record {
  display: grid;
  grid-template-columns: 2rem minmax(11rem, 1fr) minmax(8rem, 0.55fr) minmax(8rem, 0.55fr) minmax(12rem, 1.3fr) auto;
  gap: 1.5rem;
  align-items: center;
  min-height: 9rem;
  padding: 1.5rem;
  border-bottom: var(--rule);
}

.actor-record__identity {
  display: flex;
  flex-direction: column;
  gap: 0.7rem;
}

.actor-record__identity input:last-child {
  color: var(--ink-soft);
  font-family: var(--sans);
  font-size: 0.7rem;
}

.narrative-sequence {
  display: grid;
  grid-template-columns: 58fr 42fr;
}

.narrative-sequence .thought-field {
  min-height: 24rem;
}

.narrative-sequence .thought-field:nth-child(2) {
  background: var(--raised);
}

.narrative-sequence .thought-field:nth-child(3) {
  background: var(--vermillion-pale);
}

.experiment-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  border-left: var(--rule);
}

.experiment-record {
  display: flex;
  flex-direction: column;
  min-height: 23rem;
  padding: clamp(1.5rem, 3vw, 3rem);
  border-right: var(--rule);
  border-bottom: var(--rule);
}

.experiment-record header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 3rem;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.62rem;
}

.experiment-record textarea {
  min-height: 8rem;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.35rem;
}

.experiment-record input {
  margin: 1rem 0 2rem;
  padding: 0.8rem 0;
  border: 0;
  border-bottom: var(--rule);
  outline: none;
  background: transparent;
  color: var(--ink-soft);
  font-size: 0.75rem;
}

.difference-record {
  padding: clamp(1.5rem, 3vw, 3rem);
  border-right: var(--rule);
  border-bottom: var(--rule);
  border-left: var(--rule);
}

.difference-record header {
  display: grid;
  grid-template-columns: 3rem 1fr;
  gap: 1rem;
  margin-bottom: 2rem;
}

.difference-record header span {
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.62rem;
}

.difference-record__positions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border: var(--rule);
}

.difference-record__positions textarea {
  min-height: 10rem;
  padding: 1.5rem;
  border: 0;
  color: var(--ink);
  font-family: var(--serif);
  font-size: 1.2rem;
}

.difference-record__positions textarea:first-child {
  border-right: var(--rule);
  background: var(--vermillion-pale);
}

.difference-record__positions textarea:last-child {
  background: var(--mineral-pale);
}

.difference-record__coordination {
  width: 100%;
  margin: 1.5rem 0;
}

.error-page {
  display: flex;
  flex-direction: column;
  justify-content: center;
  min-height: 100vh;
  padding: var(--gutter);
}

.error-page .meta-label {
  margin-top: 6rem;
}

.error-page h1 {
  max-width: 50rem;
  margin: 1rem 0 2rem;
  font-family: var(--serif);
  font-size: clamp(3rem, 7vw, 7rem);
  font-weight: 400;
  letter-spacing: -0.06em;
  line-height: 0.95;
}

.text-link {
  width: max-content;
  border-bottom: 1px solid var(--vermillion);
  color: var(--vermillion-deep);
  font-family: var(--mono);
  font-size: 0.65rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.archive-index {
  margin: 1rem 0 4rem;
  border-top: 2px solid var(--ink);
}

.archive-index summary {
  display: flex;
  justify-content: space-between;
  padding: 1.25rem 0;
  border-bottom: var(--rule);
  cursor: pointer;
  list-style: none;
}

.archive-index summary::-webkit-details-marker {
  display: none;
}

.archive-index summary span:first-child {
  font-family: var(--serif);
  font-size: 1.35rem;
}

.archive-index summary span:last-child {
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.archive-index:not([open]) summary::after {
  margin-left: 1rem;
  color: var(--vermillion);
  content: "+";
}

.archive-index[open] summary::after {
  margin-left: 1rem;
  color: var(--vermillion);
  content: "−";
}

.modal--decision {
  max-width: 34rem;
}

.modal--sync {
  max-width: 62rem;
}

.modal--material {
  max-width: 42rem;
}

.delete-dialog {
  padding: clamp(2rem, 5vw, 4rem);
  outline: none;
}

.delete-dialog h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 400;
  letter-spacing: -0.055em;
  line-height: 0.95;
}

.delete-dialog blockquote {
  padding: 1.5rem 0;
  margin: 2rem 0;
  border-top: var(--rule);
  border-bottom: var(--rule);
  color: var(--vermillion-deep);
  font-family: var(--serif);
  font-size: 1.4rem;
}

.delete-dialog > p:not(.dialog-index) {
  color: var(--ink-soft);
  font-family: var(--serif);
  line-height: 1.5;
}

.destructive-button {
  min-height: 2.8rem;
  padding: 0 1.25rem;
  border: 1px solid var(--vermillion-deep);
  border-radius: var(--radius-control);
  background: var(--vermillion-deep);
  color: var(--raised);
  font-family: var(--mono);
  font-size: 0.64rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.sync-dialog {
  padding: clamp(2rem, 5vw, 4rem);
  outline: none;
}

.sync-dialog h2 {
  max-width: 30rem;
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2.5rem, 6vw, 4rem);
  font-weight: 400;
  letter-spacing: -0.055em;
  line-height: 0.95;
}

.sync-dialog > p,
.sync-dialog form > p {
  max-width: 30rem;
  color: var(--ink-soft);
  font-family: var(--serif);
  line-height: 1.5;
}

.sync-dialog__identity {
  padding: 1rem 0;
  margin-top: 2rem;
  border-top: var(--rule);
  border-bottom: var(--rule);
  color: var(--ink) !important;
  font-family: var(--mono) !important;
  font-size: 0.67rem;
  letter-spacing: 0.06em;
}

.sync-dialog__warning,
.sync-dialog__notice {
  padding-left: 1rem;
  border-left: 0.2rem solid var(--vermillion);
  color: var(--vermillion-deep) !important;
}

.sync-dialog form {
  margin-top: 2rem;
}

.sync-dialog [data-rac] {
  display: flex;
  flex-direction: column;
}

.sync-dialog label {
  margin: 1.5rem 0 0.45rem;
  font-family: var(--mono);
  font-size: 0.62rem;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
}

.sync-dialog input {
  width: 100%;
  padding: 0.75rem 0;
  border: 0;
  border-bottom: var(--rule);
  border-radius: 0;
  outline: none;
  background: transparent;
  font-family: var(--serif);
  font-size: 1.1rem;
}

.sync-dialog input:focus {
  border-bottom-color: var(--vermillion);
}

.material-dialog {
  padding: clamp(2rem, 5vw, 4rem);
  outline: none;
}

.material-dialog h2 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2.7rem, 6vw, 4.5rem);
  font-weight: 400;
  letter-spacing: -0.06em;
  line-height: 0.95;
}

.material-dialog > p:not(.dialog-index) {
  max-width: 30rem;
  color: var(--ink-soft);
  font-family: var(--serif);
  line-height: 1.5;
}

.material-choices {
  display: grid;
  margin-top: 2.5rem;
  border-top: 2px solid var(--ink);
}

.material-choices [role="radio"] {
  display: grid;
  grid-template-columns: 2.2rem minmax(0, 1fr) auto;
  gap: 1rem;
  align-items: center;
  min-height: 6.5rem;
  padding: 1rem 0;
  border-bottom: var(--rule);
  cursor: pointer;
}

.material-choices [role="radio"] > span {
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.58rem;
}

.material-choices [role="radio"] label {
  font-family: var(--serif);
  font-size: 1.35rem;
}

.material-choices [role="radio"] p {
  margin: 0.35rem 0 0;
  color: var(--ink-soft);
  font-size: 0.75rem;
  line-height: 1.45;
}

.material-choices [role="radio"] > i {
  color: var(--vermillion);
  font-style: normal;
}

.material-choices [role="radio"][data-selected] {
  background: color-mix(in srgb, var(--vermillion) 5%, transparent);
}

.dialog-actions--spread {
  justify-content: space-between;
}

.dialog-actions--spread > div {
  display: flex;
  gap: 1rem;
}

.conflict-index {
  margin-top: 2rem;
  border-top: 2px solid var(--ink);
}

.conflict-index__row {
  display: flex;
  justify-content: space-between;
  gap: 2rem;
  align-items: center;
  width: 100%;
  padding: 1.15rem 0;
  border: 0;
  border-bottom: var(--rule);
  background: transparent;
  text-align: left;
}

.conflict-index__row span {
  display: grid;
  gap: 0.25rem;
}

.conflict-index__row strong {
  font-family: var(--serif);
  font-size: 1.1rem;
  font-weight: 500;
}

.conflict-index__row small,
.conflict-index__row b {
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.58rem;
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.conflict-index__row b {
  color: var(--vermillion-deep);
}

.conflict-review > p:not(.dialog-index) {
  max-width: 42rem;
  color: var(--ink-soft);
  font-family: var(--serif);
  line-height: 1.5;
}

.conflict-review__legend {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
  padding: 1rem 0;
  margin-top: 2rem;
  border-top: 2px solid var(--ink);
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.conflict-review__sections {
  border-bottom: 2px solid var(--ink);
}

.conflict-section {
  display: grid;
  grid-template-columns: 8rem 1fr 1fr;
  gap: 1rem;
  padding: 0.75rem 0;
  border-top: var(--rule);
}

.conflict-section h3 {
  margin: 0;
  padding: 0.85rem 0;
  font-family: var(--mono);
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.conflict-section button {
  display: grid;
  gap: 0.5rem;
  min-height: 5.5rem;
  padding: 0.8rem 1rem;
  border: 1px solid transparent;
  background: color-mix(in srgb, var(--ground) 55%, transparent);
  text-align: left;
}

.conflict-section button.is-selected {
  border-color: var(--mineral);
  background: color-mix(in srgb, var(--mineral) 9%, var(--raised));
}

.conflict-section button.is-selected::after {
  align-self: end;
  color: var(--mineral-deep);
  content: "Selected";
  font-family: var(--mono);
  font-size: 0.52rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.conflict-section small {
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.54rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.conflict-section span {
  display: -webkit-box;
  overflow: hidden;
  font-family: var(--serif);
  font-size: 0.92rem;
  line-height: 1.35;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.conflict-review__remote {
  padding-top: 1rem;
}

.conflict-review__remote button {
  padding: 0;
  border: 0;
  border-bottom: 1px solid var(--quiet-dark);
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.56rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

/* History is a working ledger: entries accumulate; they do not become cards. */
.case-history {
  min-height: 100vh;
  padding: 0 var(--gutter) 5rem;
}

.history-header {
  grid-template-columns: 5rem minmax(0, 1.6fr) minmax(17rem, 0.65fr);
  gap: 2.5rem;
  align-items: end;
  min-height: 17rem;
  padding: 3rem 0;
}

.history-header > p {
  max-width: 28rem;
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  line-height: 1.5;
}

.history-composition {
  display: grid;
  grid-template-columns: minmax(19rem, 0.78fr) minmax(28rem, 1.5fr);
  gap: clamp(2rem, 5vw, 6rem);
  max-width: 100rem;
  padding-top: 3rem;
  margin: 0 auto;
}

.history-entry-form {
  align-self: start;
  padding: 2rem;
  border-top: 0.28rem solid var(--vermillion);
  background: color-mix(in srgb, var(--raised) 68%, transparent);
}

.history-kind {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin: 1.5rem 0 0.8rem;
  border-bottom: var(--rule);
}

.history-kind button,
.history-filters button {
  padding: 0.7rem;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.58rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.history-kind button.is-selected {
  background: var(--ink);
  color: var(--raised);
}

.history-entry-form label {
  display: grid;
  gap: 0.4rem;
  margin-top: 1.4rem;
}

.history-entry-form label > span {
  font-family: var(--mono);
  font-size: 0.58rem;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.history-entry-form textarea,
.history-entry-form input,
.history-entry-form select {
  width: 100%;
  padding: 0.7rem 0;
  border: 0;
  border-bottom: var(--rule);
  border-radius: 0;
  outline: none;
  background: transparent;
  font-family: var(--serif);
  font-size: 0.95rem;
  line-height: 1.45;
}

.history-entry-form textarea {
  resize: vertical;
}

.history-entry-form textarea:focus,
.history-entry-form input:focus,
.history-entry-form select:focus {
  border-bottom-color: var(--vermillion);
}

.history-entry-form__pair {
  display: grid;
  grid-template-columns: 0.8fr 1.2fr;
  gap: 1.5rem;
}

.history-entry-form > .action-button {
  margin-top: 2rem;
}

.history-ledger > header {
  display: flex;
  justify-content: space-between;
  gap: 2rem;
  align-items: end;
  min-height: 4.5rem;
  padding-bottom: 1rem;
  border-bottom: 2px solid var(--ink);
}

.history-ledger > header strong {
  display: block;
  margin-top: 0.35rem;
  font-family: var(--serif);
  font-size: 1.25rem;
  font-weight: 500;
}

.history-filters {
  display: flex;
}

.history-filters button {
  padding: 0.45rem 0.7rem;
}

.history-filters button.is-selected {
  box-shadow: inset 0 -2px var(--vermillion);
  color: var(--ink);
}

.history-ledger ol {
  padding: 0;
  margin: 0;
  list-style: none;
}

.history-entry {
  display: grid;
  grid-template-columns: 8rem minmax(0, 1fr);
  gap: 2rem;
  padding: 2rem 0;
  border-bottom: var(--rule);
}

.history-entry__moment {
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  align-items: flex-start;
}

.history-entry__moment span {
  padding: 0.25rem 0.45rem;
  border: 1px solid var(--mineral);
  color: var(--mineral-deep);
  font-family: var(--mono);
  font-size: 0.52rem;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.history-entry--decision .history-entry__moment span {
  border-color: var(--vermillion);
  color: var(--vermillion-deep);
}

.history-entry__moment time {
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.54rem;
  line-height: 1.45;
  text-transform: uppercase;
}

.history-entry__body h2 {
  max-width: 42rem;
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(1.25rem, 2.2vw, 1.8rem);
  font-weight: 500;
  letter-spacing: -0.025em;
  line-height: 1.14;
}

.history-entry__body > p {
  max-width: 42rem;
  margin: 0.8rem 0 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  line-height: 1.5;
}

.history-entry__body footer {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem 1.5rem;
  margin-top: 1.25rem;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.55rem;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.history-entry__body cite {
  font-style: normal;
}

.history-empty {
  padding: 3rem 0;
  margin: 0;
  border-bottom: var(--rule);
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 1.1rem;
}

/* Brief: a document surface, not another editing workspace. */
.case-brief-page {
  min-height: 100vh;
  padding: 0 var(--gutter) 6rem;
}

.brief-header {
  grid-template-columns: 5rem minmax(0, 1.6fr) minmax(17rem, 0.65fr);
  gap: 2.5rem;
  align-items: end;
  min-height: 17rem;
  padding: 3rem 0;
}

.brief-header > p {
  max-width: 28rem;
  margin: 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  line-height: 1.5;
}

.brief-controls {
  display: grid;
  grid-template-columns: 1fr 1.4fr auto;
  gap: 2rem;
  align-items: end;
  max-width: 82rem;
  padding: 1.5rem 0 2.5rem;
  margin: 0 auto;
}

.brief-controls label {
  display: grid;
  gap: 0.45rem;
}

.brief-controls label span {
  font-family: var(--mono);
  font-size: 0.58rem;
  font-weight: 600;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

.brief-controls input {
  width: 100%;
  padding: 0.65rem 0;
  border: 0;
  border-bottom: var(--rule);
  border-radius: 0;
  outline: none;
  background: transparent;
  font-family: var(--serif);
}

.brief-controls input:focus {
  border-bottom-color: var(--vermillion);
}

.brief-controls > div {
  display: flex;
  gap: 1.25rem;
}

.brief-controls button {
  padding: 0.35rem 0;
  border: 0;
  border-bottom: 1px solid var(--mineral);
  background: transparent;
  color: var(--mineral-deep);
  font-family: var(--mono);
  font-size: 0.57rem;
  font-weight: 600;
  letter-spacing: 0.07em;
  white-space: nowrap;
  text-transform: uppercase;
}

.context-brief {
  max-width: 82rem;
  margin: 0 auto;
  border: var(--rule);
  background:
    repeating-linear-gradient(96deg, transparent 0 14px, rgb(46 52 56 / 1.2%) 15px),
    var(--raised);
  box-shadow: 0 1.5rem 5rem rgb(35 38 36 / 9%);
}

.context-brief__cover {
  display: grid;
  grid-template-columns: minmax(0, 2.2fr) minmax(14rem, 0.8fr);
  gap: 2rem 5rem;
  min-height: 29rem;
  padding: clamp(3rem, 7vw, 7rem);
  border-bottom: 0.4rem solid var(--vermillion);
}

.context-brief__cover > p {
  grid-column: 1 / -1;
  align-self: start;
  margin: 0;
  color: var(--vermillion-deep);
  font-family: var(--mono);
  font-size: 0.6rem;
  letter-spacing: 0.13em;
}

.context-brief__cover h1 {
  align-self: end;
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(3.5rem, 7vw, 7.5rem);
  font-weight: 400;
  letter-spacing: -0.065em;
  line-height: 0.87;
}

.context-brief__cover > strong {
  grid-column: 1;
  font-family: var(--serif);
  font-size: 1.35rem;
  font-weight: 500;
}

.context-brief__cover dl {
  grid-column: 2;
  grid-row: 2 / 4;
  align-self: end;
  margin: 0;
  border-top: 2px solid var(--ink);
}

.context-brief__cover dt {
  padding-top: 1rem;
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.54rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.context-brief__cover dd {
  padding: 0.35rem 0 1rem;
  margin: 0;
  border-bottom: var(--rule);
  font-family: var(--serif);
  line-height: 1.35;
}

.context-brief__situation,
.brief-section {
  display: grid;
  grid-template-columns: 5rem minmax(0, 1fr);
  gap: clamp(2rem, 5vw, 6rem);
  padding: clamp(2.5rem, 6vw, 6rem);
  border-bottom: var(--rule);
}

.brief-folio {
  margin: 0;
  color: var(--vermillion);
  font-family: var(--mono);
  font-size: 0.63rem;
  letter-spacing: 0.1em;
}

.context-brief__situation h2 {
  max-width: 58rem;
  margin: 1.25rem 0 0;
  font-family: var(--serif);
  font-size: clamp(1.8rem, 3.5vw, 3.5rem);
  font-weight: 400;
  letter-spacing: -0.04em;
  line-height: 1.08;
}

.brief-section > div > h2 {
  max-width: 50rem;
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2rem, 4vw, 4rem);
  font-weight: 400;
  letter-spacing: -0.05em;
  line-height: 0.98;
}

.brief-section__introduction {
  max-width: 55rem;
  margin: 1.5rem 0 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: clamp(1.1rem, 1.8vw, 1.4rem);
  line-height: 1.5;
}

.brief-section ul {
  padding: 0;
  margin: 3rem 0 0;
  border-top: 2px solid var(--ink);
  list-style: none;
}

.brief-section li {
  display: grid;
  grid-template-columns: minmax(9rem, 0.55fr) minmax(15rem, 1fr);
  gap: 1rem 2rem;
  padding: 1.4rem 0;
  border-bottom: var(--rule);
}

.brief-section li > span {
  color: var(--ink-soft);
  font-family: var(--mono);
  font-size: 0.57rem;
  letter-spacing: 0.06em;
  line-height: 1.5;
  text-transform: uppercase;
}

.brief-section li > strong {
  font-family: var(--serif);
  font-size: 1.08rem;
  font-weight: 500;
  line-height: 1.35;
}

.brief-section li > p {
  grid-column: 2;
  margin: -0.35rem 0 0;
  color: var(--ink-soft);
  font-family: var(--serif);
  font-size: 0.9rem;
  line-height: 1.5;
}

.context-brief__footer {
  display: flex;
  justify-content: space-between;
  gap: 2rem;
  padding: 1.5rem clamp(2.5rem, 6vw, 6rem);
  color: var(--quiet-dark);
  font-family: var(--mono);
  font-size: 0.53rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

@media (max-width: 700px) {
  .conflict-review__legend {
    display: none;
  }

  .conflict-section {
    grid-template-columns: 1fr;
  }

  .conflict-section h3 {
    padding-bottom: 0;
  }

  .dialog-actions--spread {
    align-items: stretch;
    flex-direction: column-reverse;
  }

  .dialog-actions--spread > div {
    flex-direction: column-reverse;
  }

  .history-header {
    grid-template-columns: 2rem minmax(0, 1fr);
    gap: 1rem;
    min-height: 15rem;
  }

  .history-header > p {
    grid-column: 2;
  }

  .history-composition {
    grid-template-columns: 1fr;
  }

  .history-entry-form {
    padding: 1.5rem;
  }

  .history-entry-form__pair {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .history-ledger > header {
    align-items: flex-start;
    flex-direction: column;
  }

  .history-entry {
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .history-entry__moment {
    flex-direction: row;
    align-items: center;
  }

  .brief-header {
    grid-template-columns: 2rem minmax(0, 1fr);
    gap: 1rem;
    min-height: 15rem;
  }

  .brief-header > p {
    grid-column: 2;
  }

  .brief-controls {
    grid-template-columns: 1fr;
    gap: 1rem;
  }

  .brief-controls > div {
    flex-wrap: wrap;
    margin-top: 0.5rem;
  }

  .context-brief__cover {
    grid-template-columns: 1fr;
    min-height: 34rem;
    padding: 2rem;
  }

  .context-brief__cover h1,
  .context-brief__cover > strong,
  .context-brief__cover dl {
    grid-column: 1;
    grid-row: auto;
  }

  .context-brief__situation,
  .brief-section {
    grid-template-columns: 2rem minmax(0, 1fr);
    gap: 1rem;
    padding: 2rem 1.5rem;
  }

  .brief-section li {
    grid-template-columns: 1fr;
  }

  .brief-section li > p {
    grid-column: 1;
  }

  .context-brief__footer {
    align-items: flex-start;
    flex-direction: column;
    padding: 1.5rem;
  }
}

@media print {
  @page {
    margin: 14mm;
  }

  body {
    background: white;
  }

  body::before,
  body::after,
  .case-rail,
  .brief-header,
  .brief-controls {
    display: none !important;
  }

  .case-shell {
    display: block;
  }

  .case-brief-page {
    padding: 0;
  }

  .context-brief {
    max-width: none;
    border: 0;
    box-shadow: none;
  }

  .context-brief__cover,
  .context-brief__situation,
  .brief-section {
    break-inside: avoid;
  }

  .context-brief__cover {
    min-height: 240mm;
  }
}

@keyframes veil-in {
  from { opacity: 0; }
}

@keyframes sheet-in {
  from { opacity: 0; transform: translateY(1.5rem) scale(0.98); }
}

@keyframes record-line {
  from { transform: translateX(-100%); }
  to { transform: translateX(250%); }
}

@keyframes sync-turn {
  to { transform: rotate(360deg); }
}

@media (max-width: 1100px) {
  :root {
    --rail: 13.5rem;
  }

  .portfolio__introduction {
    grid-template-columns: 3rem minmax(0, 1fr);
  }

  .portfolio__thesis {
    grid-column: 2;
  }

  .case-row {
    grid-template-columns: 3rem minmax(13rem, 2fr) minmax(13rem, 2fr) minmax(8rem, 1fr) 1rem;
  }

  .workspace__header {
    grid-template-columns: 2rem minmax(20rem, 1.5fr) minmax(14rem, 0.7fr);
  }

  .actor-record {
    grid-template-columns: 2rem minmax(11rem, 1fr) 8rem 8rem;
  }

  .actor-record textarea {
    grid-column: 2 / 5;
  }

  .actor-record .remove-record {
    grid-column: 4;
    justify-self: end;
  }
}

@media (max-width: 820px) {
  .portfolio__masthead {
    min-height: 5rem;
  }

  .portfolio__date span {
    display: none;
  }

  .portfolio__introduction {
    min-height: auto;
    padding: 4rem 0 3rem;
  }

  .portfolio__introduction h1 {
    font-size: clamp(3.1rem, 12vw, 5.5rem);
  }

  .case-index {
    display: block;
  }

  .case-index__header {
    display: flex;
    justify-content: space-between;
  }

  .case-row {
    grid-template-columns: 2rem minmax(0, 1fr) auto;
    min-height: 9rem;
  }

  .case-row__signal {
    grid-row: 2;
    grid-column: 2 / 4;
    align-self: start;
  }

  .case-row__meta {
    grid-column: 3;
  }

  .case-row__arrow {
    display: none;
  }

  .case-index__footer {
    display: flex;
    padding-left: 2rem;
  }

  .case-shell {
    display: block;
    padding-bottom: 4.25rem;
  }

  .case-rail {
    position: fixed;
    z-index: 90;
    top: auto;
    right: 0;
    bottom: 0;
    left: 0;
    display: block;
    height: 4.25rem;
    border-top: var(--rule);
    border-right: 0;
    background: var(--ground-deep);
  }

  .case-rail__brand,
  .back-to-index,
  .case-rail__identity,
  .case-rail__footer {
    display: none;
  }

  .case-navigation {
    display: flex;
    height: 100%;
    padding: 0;
    overflow-x: auto;
    overscroll-behavior-x: contain;
    scrollbar-width: none;
  }

  .case-navigation::-webkit-scrollbar {
    display: none;
  }

  .case-navigation__index-mobile {
    display: flex;
    flex: 0 0 4.5rem;
    flex-direction: column;
    justify-content: center;
    gap: 0.3rem;
    border-right: var(--rule);
    color: var(--ink-soft);
    text-align: center;
  }

  .case-navigation__index-mobile span {
    color: var(--vermillion);
    font-size: 0.7rem;
  }

  .case-navigation__index-mobile strong {
    font-family: var(--mono);
    font-size: 0.48rem;
    letter-spacing: -0.03em;
    text-transform: uppercase;
  }

  .case-navigation__item {
    display: flex;
    flex: 0 0 5.25rem;
